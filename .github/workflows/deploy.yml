name: Provision, Build and Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "helm/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/github-mcp-server
  AWS_REGION: eu-west-2
  EKS_CLUSTER_NAME: mcp-observability-demo-cluster

jobs:
  # Detect which paths changed so app-only pushes skip terraform (and its AWS auth).
  changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            app:
              - 'server/**'
              - 'helm/**'
              - '.github/workflows/deploy.yml'

  # --- Infra: plan on every PR touching terraform/, apply only on main when terraform/ changed ---
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required for GitHub OIDC → AWS role assumption
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=mcp-observability-demo/terraform.tfstate" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      # Surfaces the plan directly on the PR so infra changes get reviewed
      # before merge, same as a code review — this is the habit that
      # separates "I can run terraform apply" from "I understand change
      # management," which is exactly what a client cares about.
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    # Plan stays PR-only; apply runs on main only when terraform/ actually changed.
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.terraform == 'true'
    needs: changes
    runs-on: ubuntu-latest
    environment: production # manual approval gate — infra changes shouldn't auto-apply unreviewed
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC → AWS role assumption
    defaults:
      run:
        working-directory: terraform
    outputs:
      cluster_name: ${{ steps.cluster.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=mcp-observability-demo/terraform.tfstate" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Expose cluster name
        id: cluster
        run: echo "name=${{ env.EKS_CLUSTER_NAME }}" >> "$GITHUB_OUTPUT"

  # --- App: build image with uv-based Dockerfile, push to GHCR ---
  build-and-push:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.app == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  # --- Release: deploy the app onto whatever terraform-apply provisioned ---
  deploy:
    # App deploy no longer hard-requires a terraform apply in the same run.
    # If apply ran (infra changed), wait for it; if it was skipped, deploy alone.
    if: >
      always() &&
      !cancelled() &&
      needs.build-and-push.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    needs: [changes, terraform-apply, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC → AWS role assumption
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: Deploy via Helm
        run: |
          helm upgrade --install github-mcp-server ./helm/mcp-server \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 3m

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://github-mcp-server/healthz
