name: Provision, Build and Deploy MCP Server

# Linear pipeline on main / manual dispatch:
#   terraform plan → terraform apply → build & push (ECR) → deploy (EKS)
# PRs that touch terraform/ still get a plan-only review comment (no apply).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "helm/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-2
  TF_WORKING_DIR: terraform

jobs:
  # -------------------------------------------------------------------------
  # 1. Terraform Plan
  # -------------------------------------------------------------------------
  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false # needed so plan file / exit codes behave normally

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=mcp-observability-demo/terraform.tfstate" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan -detailed-exitcode
          exitcode=$?
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          # 0 = no changes, 1 = error, 2 = changes present — only 1 is a failure
          if [ "$exitcode" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.txt
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const body = `#### Terraform Plan\n\`\`\`\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # -------------------------------------------------------------------------
  # 2. Terraform Apply  (main / workflow_dispatch only; applies the saved plan)
  # -------------------------------------------------------------------------
  terraform-apply:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      cluster_name: ${{ steps.outs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.outs.outputs.ecr_repository_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=mcp-observability-demo/terraform.tfstate" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        # Skip apply when plan reported no changes (exitcode 0)
        if: needs.terraform-plan.outputs.plan_exitcode == '2' || needs.terraform-plan.outputs.plan_exitcode == '0'
        run: |
          if [ "${{ needs.terraform-plan.outputs.plan_exitcode }}" = "2" ]; then
            terraform apply -auto-approve -input=false tfplan
          else
            echo "No infrastructure changes; skipping apply."
          fi

      - name: Export Terraform outputs
        id: outs
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 3. Build & push image to ECR
  # -------------------------------------------------------------------------
  build-and-push:
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          TAG="${GITHUB_SHA::8}"
          IMAGE_URI="${{ needs.terraform-apply.outputs.ecr_repository_url }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_uri }}:latest

  # -------------------------------------------------------------------------
  # 4. Deploy to EKS via Helm
  # -------------------------------------------------------------------------
  deploy:
    needs: [terraform-apply, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.terraform-apply.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: Deploy via Helm
        run: |
          helm upgrade --install github-mcp-server ./helm/mcp-server \
            --set image.repository=${{ needs.build-and-push.outputs.image_uri }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 3m

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://github-mcp-server/healthz
