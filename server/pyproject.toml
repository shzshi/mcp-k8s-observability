[project]
name = "github-mcp-server"
version = "0.1.0"
description = "Observable GitHub MCP server, deployed on Kubernetes"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27.0",
    "langfuse>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# single-module package — nothing to build into a wheel structure,
# this just keeps hatchling happy for `uv sync`
packages = ["."]
include = ["mcp_server.py", "langfuse_middleware.py"]
