replicaCount: 2

image:
  # Overridden by CI to the ECR URL from `terraform output -raw ecr_repository_url`
  repository: ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/mcp-obs-demo/github-mcp-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Secrets are pulled from AWS Secrets Manager via External Secrets
# Operator (see secretstore.yaml + externalsecret.yaml) — nothing here,
# and no static secret values ever touch this repo or Helm's own state.
secretName: github-mcp-secrets

aws:
  region: eu-west-2

externalSecrets:
  refreshInterval: 5m # how often ESO re-checks Secrets Manager for changes
  secretsManagerSecretName: mcp-obs-demo/mcp-server-secrets # must match terraform's aws_secretsmanager_secret name

env:
  LOG_LEVEL: INFO
  LANGFUSE_HOST: "https://cloud.langfuse.com"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations:
  # Enables Datadog autodiscovery to scrape this pod without extra config
  ad.datadoghq.com/github-mcp-server.check_names: '["openmetrics"]'
