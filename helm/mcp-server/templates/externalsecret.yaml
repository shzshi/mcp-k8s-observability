apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "5m" }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  # Secrets Manager holds one JSON blob at the ARN below; these `property`
  # fields pick individual keys out of that JSON and map them onto the
  # K8s Secret keys the Deployment already expects (see values.yaml /
  # deployment.yaml — same key names as the old manual secrets.yaml, so
  # nothing else in the chart needs to change).
  data:
    - secretKey: github-token
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName }}
        property: github-token
    - secretKey: langfuse-public-key
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName }}
        property: langfuse-public-key
    - secretKey: langfuse-secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName }}
        property: langfuse-secret-key
