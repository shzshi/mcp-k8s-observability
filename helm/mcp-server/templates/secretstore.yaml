apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      # No explicit `auth` block: this operator's pod already carries an
      # IRSA-bound IAM role (set up in terraform/secrets.tf, scoped to
      # only this one secret), so it authenticates via the default AWS
      # SDK credential chain automatically — no static keys anywhere.
